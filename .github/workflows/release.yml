name: cli-release
on:
  push:
    tags:
      - cli-v*
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go version
      - uses: actions/upload-artifact@v4
        with:
          name: probe-artifact
          path: go.mod