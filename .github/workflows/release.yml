name: cli-release
on:
  push:
    tags:
      - cli-v*
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -trimpath -o authris-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with:
          name: authris-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          path: authris-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "${{ github.ref_name }}" dist/* --title "authris CLI ${{ github.ref_name }}" --notes "Install: see README.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
